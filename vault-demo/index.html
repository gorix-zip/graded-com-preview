<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101112">
  <meta name="description" content="A local Graded vault and card-scanning demo.">
  <title>graded · vault demo</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/graded-wordmark-color.svg">
  <link rel="preload" href="../assets/fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app" id="app" aria-label="graded vault demo">
    <div class="vault-opening" id="vaultOpening" role="status" aria-label="Opening your vault">
      <button class="opening-skip" type="button" data-action="skip-opening">Skip</button>
      <div class="opening-stage" aria-hidden="true">
        <div class="opening-door"><img src="../assets/brand/graded-logomark.svg" alt=""></div>
        <span class="opening-ring opening-ring--one"></span><span class="opening-ring opening-ring--two"></span>
      </div>
      <p>Opening your vault</p><span class="opening-caption">Your collection, in one place</span>
    </div>
    <header class="topbar">
      <span class="topbar-mark"><img src="../assets/brand/graded-wordmark-ink.svg" alt="graded" width="92" height="24"></span>
      <button class="icon-button" type="button" data-action="help" aria-label="Help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.7c-1.1 1-1.7 1.3-1.7 2.8M12 17h.01"></path></svg>
      </button>
    </header>
    <section class="screen" id="screen" aria-live="polite" aria-atomic="false"></section>
    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab is-active" type="button" data-tab="vault" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3" width="17" height="18" rx="2.5"></rect><rect x="6.5" y="6" width="11" height="12" rx="1.5"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M12 8v1.5m0 5V16m4-4h-1.5m-5 0H8m6.83-2.83-1.06 1.06m-3.54 3.54-1.06 1.06m5.66 0-1.06-1.06m-3.54-3.54-1.06-1.06"></path></svg><span>Vault</span>
      </button>
      <button class="scan-fab" type="button" data-action="scan" aria-label="Scan a card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3l1.5-2h7l1.5 2h3A1.5 1.5 0 0 1 21.5 9v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span>Scan</span>
      </button>
      <button class="tab" type="button" data-tab="orders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h8l3 3V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5Z"></path><path d="M14.5 3.8V7h3.2M9 11h6M9 14.5h6"></path></svg><span>Orders</span>
      </button>
      <button class="tab" type="button" data-tab="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.5-3.6 3.1-5.5 7-5.5s6.5 1.9 7 5.5"></path></svg><span>Account</span>
      </button>
    </nav>
    <dialog class="card-dialog" id="cardDialog" aria-label="Interactive card details"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
